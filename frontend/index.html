<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GarageOnDemand</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
      /* Globalne ulepszenia wizualne */
      :root {
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(255, 255, 255, 0.18);
      }

      body {
        font-family: 'Outfit', sans-serif;
        /* Dynamiczny animowany gradient w tle, który ożywi całą aplikację */
        background: linear-gradient(-45deg, #eef2ff, #e0e7ff, #ede9fe, #f3e8ff);
        background-size: 400% 400%;
        animation: gradientAnimation 15s ease infinite;
        min-height: 100vh;
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: #0f172a;
      }

      @keyframes gradientAnimation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Premium Scrollbar na całą aplikację */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.02);
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #818cf8, #c084fc);
        border-radius: 9999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(to bottom, #6366f1, #a855f7);
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      /* Globalne gładkie przejścia dla elementów interaktywnych */
      button, a, input, select, textarea {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
    </style>
  </head>
  <body>
    <div id="app" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
