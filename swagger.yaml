components:
  schemas:
    AuthToken:
      type: object
      properties:
        token:
          type: string
          readOnly: true
      required:
      - token
    AuthTokenRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
          title: Nazwa użytkownika
        password:
          type: string
          writeOnly: true
          minLength: 1
          title: Hasło
      required:
      - password
      - username
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - old_password
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - new_password
      - old_password
    Equipment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
          description: Nazwa ikony lub emoji
          maxLength: 50
      required:
      - id
      - name
    EquipmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
          description: Nazwa ikony lub emoji
          maxLength: 50
      required:
      - name
    Garage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 255
        price_per_hour:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        price_per_day:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        description:
          type: string
          nullable: true
        width:
          type: number
          format: double
          nullable: true
          description: Szerokość w metrach
        length:
          type: number
          format: double
          nullable: true
          description: Długość w metrach
        height:
          type: number
          format: double
          nullable: true
          description: Wysokość w metrach
        is_active:
          type: boolean
        equipment:
          type: array
          items:
            type: integer
      required:
      - address
      - id
      - name
      - price_per_hour
    GarageRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 255
        price_per_hour:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        price_per_day:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        image:
          type: string
          format: binary
          nullable: true
        description:
          type: string
          nullable: true
        width:
          type: number
          format: double
          nullable: true
          description: Szerokość w metrach
        length:
          type: number
          format: double
          nullable: true
          description: Długość w metrach
        height:
          type: number
          format: double
          nullable: true
          description: Wysokość w metrach
        is_active:
          type: boolean
        equipment:
          type: array
          items:
            type: integer
      required:
      - address
      - name
      - price_per_hour
    PatchedChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
    PatchedEquipmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
          description: Nazwa ikony lub emoji
          maxLength: 50
    PatchedGarageRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 255
        price_per_hour:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        price_per_day:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        image:
          type: string
          format: binary
          nullable: true
        description:
          type: string
          nullable: true
        width:
          type: number
          format: double
          nullable: true
          description: Szerokość w metrach
        length:
          type: number
          format: double
          nullable: true
          description: Długość w metrach
        height:
          type: number
          format: double
          nullable: true
          description: Wysokość w metrach
        is_active:
          type: boolean
        equipment:
          type: array
          items:
            type: integer
    PatchedReservationRequest:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        is_historical:
          type: boolean
        garage:
          type: integer
    PatchedUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          title: Nazwa użytkownika
          description: Wymagana. 150 lub mniej znaków. Jedynie litery, cyfry i @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Adres e-mail
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          title: Imię
          maxLength: 150
        last_name:
          type: string
          title: Nazwisko
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Aktywny
          description: Określa czy użytkownika należy uważać za aktywnego. Odznacz
            zamiast usuwać konto.
        phone_number:
          type: string
          minLength: 1
    Reservation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        garage_details:
          allOf:
          - $ref: '#/components/schemas/Garage'
          readOnly: true
        user_name:
          type: string
          readOnly: true
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        access_code:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_historical:
          type: boolean
        overstayed:
          type: boolean
          readOnly: true
          description: Czy klient został w garażu po czasie?
        cancellation_reason:
          type: string
          readOnly: true
          nullable: true
          description: Powód anulowania przez admina
        cancellation_seen:
          type: boolean
          readOnly: true
          description: Czy użytkownik odczytał powiadomienie o anulowaniu?
        user:
          type: integer
          readOnly: true
        garage:
          type: integer
      required:
      - access_code
      - cancellation_reason
      - cancellation_seen
      - created_at
      - end_time
      - garage
      - garage_details
      - id
      - overstayed
      - start_time
      - status
      - total_price
      - user
      - user_name
    ReservationRequest:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        is_historical:
          type: boolean
        garage:
          type: integer
      required:
      - end_time
      - garage
      - start_time
    RoleEnum:
      enum:
      - client
      - admin
      type: string
      description: |-
        * `client` - Klient
        * `admin` - Administrator
    StatusEnum:
      enum:
      - pending
      - confirmed
      - cancelled
      - completed
      - expired
      type: string
      description: |-
        * `pending` - Oczekuje na płatność
        * `confirmed` - Potwierdzona
        * `cancelled` - Anulowana
        * `completed` - Zakończona
        * `expired` - Wygasła (Brak płatności)
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nazwa użytkownika
          description: Wymagana. 150 lub mniej znaków. Jedynie litery, cyfry i @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Adres e-mail
          maxLength: 254
        first_name:
          type: string
          title: Imię
          maxLength: 150
        last_name:
          type: string
          title: Nazwisko
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Aktywny
          description: Określa czy użytkownika należy uważać za aktywnego. Odznacz
            zamiast usuwać konto.
        phone_number:
          type: string
      required:
      - id
      - phone_number
      - username
    UserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          title: Nazwa użytkownika
          description: Wymagana. 150 lub mniej znaków. Jedynie litery, cyfry i @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Adres e-mail
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          title: Imię
          maxLength: 150
        last_name:
          type: string
          title: Nazwisko
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Aktywny
          description: Określa czy użytkownika należy uważać za aktywnego. Odznacz
            zamiast usuwać konto.
        phone_number:
          type: string
          minLength: 1
      required:
      - phone_number
      - username
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
